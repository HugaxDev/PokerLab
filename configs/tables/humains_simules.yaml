name: humains_simules
label: Humains simulés
description: "Profils humains typiques des tables en jetons fictifs (débutants qui paient trop, prudents qui se couchent trop, agressifs, réguliers moyens, pousseurs de tapis) : paramètres tirés par joueur, décisions en fréquences, tilt après une grosse perte (≈ 8 % de sièges en tilt à un instant donné, mesuré), adaptation au héros, erreurs aléatoires. Modélisation PokerLab, à ajuster."
mode: sample
session_decks: 10        # mêmes 5 adversaires sur 10 decks (60 mains) : tilt et adaptation se construisent dans la session
weights:
  humain_debutant: 0.35
  humain_prudent: 0.20
  humain_agressif: 0.15
  humain_regulier: 0.15
  humain_tapis: 0.15
