# ---------------------------------------------------------------------------------------------
# Archétypes « humains simulés » (composition humains_simules). Modélisation PokerLab, à ajuster :
# profils typiques des tables en jetons fictifs, avec des erreurs aléatoires (noise = probabilité
# de jouer une action légale au hasard à une décision donnée).
# Bloc « humain » (chaque option désactivable, enabled: false) :
#   tirage     : paramètres tirés par joueur autour de ceux de l'archétype (écart log-normal) à chaque session ;
#   mixte      : décisions en fréquences (probabilité logistique autour du seuil de range préflop, de largeur douceur ;
#                part ecart_postflop d'écarts autour du seuil de tapis postflop) au lieu de seuils déterministes ;
#   tilt       : après une perte de plus de perte_bb sur une main, ranges × elargissement et agressivité × agressivite pendant mains mains ;
#   adaptation : observe VPIP, PFR et bluffs montrés du héros sur les fenetre dernières mains (au moins min_mains) et
#                défend plus (ou moins) face à lui : préflop selon son PFR, postflop selon ses bluffs montrés et son VPIP ; force = intensité.
humain_debutant:
  label: Humain débutant (trop de paies)
  vpip: 0.45
  pfr: 0.10
  three_bet: 0.03
  limp: true
  cold_call_share: 0.8
  call_cap_bb: 6.0
  bb_defend_cap_bb: 5.0
  fold_to_3bet: 0.35
  aggression: 0.4
  cbet: 0.45
  fold_to_cbet: 0.3
  bluff: 0.06
  semi_bluff: 0.3
  thin_value: 0.2
  call_weak: 0.75
  float: 0.25
  raise_value: 0.2
  check_raise: 0.15
  bluff_raise: 0.03
  bet_size_pot: 0.55
  stackoff_min_made: top_pair
  big_bet_fraction: 1.2
  noise: 0.06
  humain:
    tirage: {enabled: true, ecart: 0.30}
    mixte: {enabled: true, douceur: 0.06, ecart_postflop: 0.15}
    tilt: {enabled: true, perte_bb: 25, mains: 20, elargissement: 1.5, agressivite: 1.8}
    adaptation: {enabled: true, fenetre: 60, min_mains: 20, force: 0.3}

